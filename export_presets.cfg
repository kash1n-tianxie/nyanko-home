[preset.0]

name="Web itch.io"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,art/expansion-v030/campaign-backgrounds.json,art/story-v026/containers-regions.json,art/story-v026/cats/manifest.json,art/immersion-v035/cats/manifest.json,art/immersion-v035/scenery/manifest.json,art/feedback-v032/deaths/manifest.json,art/cinema-v038/manifest.json,art/boss-v039/manifest.json,art/parchment-v027/ui-regions.json,fonts/*/*-OFL.txt,fonts/*/OFL.txt,fonts/*/source.json,localization/*.json,audio/free-v040/*.json,audio/free-v040/*.txt"
exclude_filter="tests/*,docs/*,work/*,outputs/*,tools/*,tooling/*,*/source/*,*/sources/*,*.md,*.py,*.command,*.log"
export_path=""
script_export_mode=2

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
